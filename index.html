<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vértice Criativo — AR</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17191F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { color-scheme: dark; }
  body {
    min-height: 100svh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at 50% 0%, #1E212A 0%, #17191F 55%, #0C0D11 100%);
    color: #F6F6F8;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { text-align: center; max-width: 32rem; }
  .mark { width: 88px; height: 88px; filter: drop-shadow(0 8px 40px rgba(224,162,76,.15)); }
  /* Vertex spin — 7s linear, the brand motion spec */
  @keyframes vertice-spin { to { transform: rotate(360deg); } }
  .spin { animation: vertice-spin 7s linear infinite; transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  h1 {
    margin-top: 1.75rem; font-size: clamp(2.75rem, 13vw, 4.25rem);
    font-weight: 500; line-height: .92; letter-spacing: -.03em;
  }
  h1 .criativo {
    display: block; font-size: .45em; letter-spacing: -.02em; margin-top: .1em;
    background: linear-gradient(180deg, #E0A24C 0%, #A15E1E 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .tagline {
    margin-top: 1.5rem; font-size: 1.05rem; font-weight: 500;
    letter-spacing: -.01em; color: #5C616D;
  }
  .tagline .accent {
    background: linear-gradient(180deg, #E0A24C 0%, #A15E1E 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .eyebrow {
    margin-top: 2.25rem; font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: .68rem; text-transform: uppercase; letter-spacing: .2em; color: rgba(92,97,109,.8);
  }
  p.note { margin-top: 1rem; font-size: .9rem; line-height: 1.65; color: #AEB4BF; }
  a { color: #E0A24C; text-decoration: none; border-bottom: 1px solid rgba(224,162,76,.3); }
  a:hover { border-bottom-color: #E0A24C; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 88 88" aria-label="Vértice Criativo" role="img">
    <g class="spin">
      <polygon points="88,87.86 0,87.86 44,43.9" fill="#191b21"/>
      <polygon points="87.93,0 88,87.86 43.99,43.9" fill="#22242b"/>
      <polygon points="0.11,0 87.93,0 43.99,43.9" fill="#3a3e48"/>
      <polygon points="0.07,87.86 0.11,0 43.99,43.9" fill="#2c2f37"/>
      <polygon points="0.2,0 42.69,42.31 42.41,42.59 0.11,0.15" fill="#e0a24c"/>
      <circle cx="43.93" cy="43.83" r="1.98" fill="#e0a24c"/>
    </g>
  </svg>

  <h1>Vértice<span class="criativo">Criativo</span></h1>

  <p class="tagline">Don’t trust. <span class="accent">Recompute.</span></p>

  <p class="eyebrow">Realidade aumentada</p>
  <p class="note">
    Esta é a página da experiência em realidade aumentada. Ainda não está publicada.<br>
    Entretanto: <a href="https://verticecriativo.pt">verticecriativo.pt</a>
  </p>
</main>
</body>
</html>
